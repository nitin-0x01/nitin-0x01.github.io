<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4">

  <!-- 1. LOGIN FORM -->
  <div id="login-box" class="w-full max-w-md bg-gray-800 p-8 rounded-xl shadow-lg border border-gray-700">
    <h2 class="text-2xl font-bold mb-6 text-center text-white">Admin Login</h2>
    <div id="login-error" class="hidden mb-4 p-3 bg-red-900/50 border border-red-500 text-red-200 text-sm rounded"></div>
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1 text-gray-300">Email Address</label>
        <input type="email" id="email" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 text-white">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1 text-gray-300">Password</label>
        <input type="password" id="password" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 text-white">
      </div>
      <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition">Log In</button>
    </form>
  </div>

  <!-- 2. ADMIN DASHBOARD -->
  <div id="dashboard-box" class="hidden w-full max-w-3xl bg-gray-800 p-8 rounded-xl shadow-lg border border-gray-700 my-8">
    <div class="flex justify-between items-center pb-6 border-b border-gray-700 mb-6">
      <div>
        <h2 class="text-2xl font-bold text-white">Manage Portfolio Content</h2>
        <p class="text-xs text-gray-400" id="user-email-display"></p>
      </div>
      <button id="logout-btn" class="bg-red-600 hover:bg-red-700 text-white text-sm font-semibold py-2 px-4 rounded-lg transition">Logout</button>
    </div>

    <div id="status-msg" class="hidden mb-4 p-3 bg-green-900/50 border border-green-500 text-green-200 text-sm rounded"></div>

    <form id="content-form" class="space-y-6">
      <div>
        <label class="block text-sm font-medium mb-1 text-gray-300">Display Name</label>
        <input type="text" id="name" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-blue-500 text-white">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1 text-gray-300">Tagline / Headline</label>
        <input type="text" id="tagline" placeholder="e.g., Computer Science Student & Full-Stack Developer" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-blue-500 text-white">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1 text-gray-300">About Me / Bio</label>
        <textarea id="about" rows="4" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-blue-500 text-white"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1 text-gray-300">Skills (Comma-separated)</label>
        <input type="text" id="skills" placeholder="React, Node.js, Python, Tailwind, Firebase" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-blue-500 text-white">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1 text-gray-300">Featured Projects (JSON Format)</label>
        <p class="text-xs text-gray-400 mb-2">Keep structured data inside the bracket format:</p>
        <textarea id="projects" rows="6" class="font-mono text-xs w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-blue-500 text-white"></textarea>
      </div>

      <button type="submit" id="save-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg transition">Save & Publish Changes</button>
    </form>
  </div>

  <!-- 3. FIREBASE LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCeudq7kNL0NzHZKDthknc7UC0QFCzxr5Y",
      authDomain: "portfolio-admin-4a3bd.firebaseapp.com",
      projectId: "portfolio-admin-4a3bd",
      storageBucket: "portfolio-admin-4a3bd.firebasestorage.app",
      messagingSenderId: "803002632579",
      appId: "1:803002632579:web:e2097d3ddc6add99360eb6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginBox = document.getElementById("login-box");
    const dashboardBox = document.getElementById("dashboard-box");
    const loginForm = document.getElementById("login-form");
    const contentForm = document.getElementById("content-form");
    const loginError = document.getElementById("login-error");
    const statusMsg = document.getElementById("status-msg");
    const logoutBtn = document.getElementById("logout-btn");
    const userEmailDisplay = document.getElementById("user-email-display");

    // Session State Listener
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        loginBox.classList.add("hidden");
        dashboardBox.classList.remove("hidden");
        userEmailDisplay.textContent = `Logged in as: ${user.email}`;
        await loadExistingData();
      } else {
        loginBox.classList.remove("hidden");
        dashboardBox.classList.add("hidden");
      }
    });

    // Handle Login
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.classList.add("hidden");
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        loginError.textContent = err.message;
        loginError.classList.remove("hidden");
      }
    });

    // Handle Logout
    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
    });

    // Load Data from Firestore
    async function loadExistingData() {
      try {
        const docRef = doc(db, "portfolio_data", "main");
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById("name").value = data.name || "";
          document.getElementById("tagline").value = data.tagline || "";
          document.getElementById("about").value = data.about || "";
          document.getElementById("skills").value = (data.skills || []).join(", ");
          document.getElementById("projects").value = JSON.stringify(data.projects || [], null, 2);
        } else {
          // Defaults if empty
          document.getElementById("projects").value = JSON.stringify([
            { "title": "Sample Project", "description": "Project description...", "link": "https://github.com" }
          ], null, 2);
        }
      } catch (err) {
        console.error("Fetch error:", err);
      }
    }

    // Save Data to Firestore
    contentForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusMsg.classList.add("hidden");

      let parsedProjects = [];
      try {
        parsedProjects = JSON.parse(document.getElementById("projects").value);
      } catch (err) {
        alert("Projects field has invalid JSON format!");
        return;
      }

      const payload = {
        name: document.getElementById("name").value,
        tagline: document.getElementById("tagline").value,
        about: document.getElementById("about").value,
        skills: document.getElementById("skills").value.split(",").map(s => s.trim()).filter(Boolean),
        projects: parsedProjects,
        updatedAt: new Date().toISOString()
      };

      try {
        await setDoc(doc(db, "portfolio_data", "main"), payload);
        statusMsg.textContent = "Changes saved to database successfully!";
        statusMsg.classList.remove("hidden");
      } catch (err) {
        alert("Save failed: " + err.message);
      }
    });
  </script>
</body>
</html>
